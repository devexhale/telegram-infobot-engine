plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.devexhale'
version = '0.0.1-SNAPSHOT'
description = 'Telegram bot template based on telegram-infobot-engine'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Resolved as a sibling Gradle module within this multi-project build
    implementation project(':telegram-infobot-engine-spring-boot-starter')
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    enabled = false
}

tasks.register("prepareKotlinBuildScriptModel") {}

tasks.named('test', Test) {
    useJUnitPlatform()
}
