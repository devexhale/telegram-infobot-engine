# Specify your bot token
telegram.bot.token=

# Or create a file with a secret and add the token there
spring.config.import=optional:application-secret.properties

# Specify the name of the bot dialog file
telegram.bot.dialog-file-name=dialog.yml

# Enter the name of your bot for logging
telegram.bot.name=BotTemplate

# Custom settings. Number of buttons in a row. Default 1.
telegram.bot.buttons-per-row=1

# Optionally, enable the /last command to preserve the user's state between interactions.
# To enable this option you must:
# 1. Change the parameter to true.
# 2. Redis configuration block in this file should be uncommented.
#    The file contains the default settings. You can customize them with your own values.
# 3. Run a Redis container.
#    Redis dependency is pre-configured in this template (minimally pre-set).
#    - For development: use docker-compose.redis-dev.yml
#    - For deployment: uncomment Redis blocks in docker-compose.bot-template.yml
telegram.bot.user-state-persistent=true
#
## Redis configuration (development)
spring.data.redis.host=localhost
spring.data.redis.port=6380

# Redis configuration (deployment)
#spring.data.redis.host=redis
#spring.data.redis.port=6379