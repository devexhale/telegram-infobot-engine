# =====================================================================================================================
# Bot Template - Application Configuration
# =====================================================================================================================
# This file contains the specific configuration for the bot-template application.
# Properties not defined here will fall back to the defaults provided by the bot-engine starter.
# =====================================================================================================================

# --- Security & Authentication ---
# Provide your Telegram Bot Token obtained from @BotFather.
# WARNING: Never commit real tokens to version control.
# [Required]
telegram.bot.token=

# Alternative: Load sensitive data from an external, git-ignored file.
# Create 'application-secret.properties' in src/main/resources and add: telegram.bot.token=YOUR_TOKEN
#spring.config.import=optional:classpath:application-secret.properties

# --- Bot Identity ---
# [Optional] Default: DefaultBot
telegram.bot.name=BotTemplate

# --- Dialog Settings ---
# Path to the configuration file containing the bot's dialog tree structure.
# [Required]
telegram.bot.dialog.file-name=dialog.yml

# Maximum number of buttons rendered per row in inline/reply keyboards
# [Optional] Default: 1
#telegram.bot.dialog.buttons-per-row=1

# --- Rate Limiting ---
# [Optional] Defaults are shown below. Uncomment and modify if your bot requires different limits.

# Global rate limit (applied across all chats combined)
#telegram.bot.rate-limit.global.capacity=25
#telegram.bot.rate-limit.global.rate=25
#telegram.bot.rate-limit.global.interval=1s
#
# Per-chat rate limit (applied to each individual chat)
#telegram.bot.rate-limit.chat.capacity=3
#telegram.bot.rate-limit.chat.rate=3
#telegram.bot.rate-limit.chat.interval=1s

# =====================================================================================================================
# Broadcast Configuration
# =====================================================================================================================
# To enable scheduled mass mailing, complete the following steps:
#
# 1. Set 'telegram.bot.broadcast.enabled' to true.
# 2. Specify the path to your broadcast definition file.
# 3. Set your application timezone (e.g., Europe/Kyiv, UTC).
# =====================================================================================================================

# [Optional] Default: false. The file-name and timezone properties are required if broadcasting is enabled.
#telegram.bot.broadcast.enabled=false
#telegram.bot.broadcast.file-name=broadcast.yml
#telegram.bot.broadcast.timezone=Europe/Kyiv

# =====================================================================================================================
# Redis Connection Settings
# =====================================================================================================================
# [Required] Necessary for user state management, chat message cleanup, and rate limiting.

# --- Local Development ---
# Used for local development mode.
# 1. Run: docker compose -f ./docker-compose.redis-dev.yml up --build -d (from the bot-template directory)
# 2. Start the application via your IDE, or run the following command:
#    ./gradlew clean :telegram-infobot-engine-bot-template:bootRun
spring.data.redis.host=localhost
spring.data.redis.port=6380

# --- Template Production / Docker Compose Deployment ---
# Used for production deployment.
# Before building: comment out the "Local Development" host/port above, and uncomment this.
# 1. Build the project:
#    ./gradlew clean :telegram-infobot-engine-bot-template:build
# 2. Run: docker compose -f ./docker-compose.bot-template-prod.yml up --build -d (from the bot-template directory)
#spring.data.redis.host=redis
#spring.data.redis.port=6379