plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'jacoco'
}

group = 'io.github.devexhale'
version = '1.0'
description = 'Telegram Infobot Engine Spring Boot Starter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

ext {
    springBootVersion = '3.5.14'
    springCoreVersion = '6.2.11'
    springDataCommonsVersion = '3.4.0'
    commonsLang3Version = '3.18.0'
    assertjVersion = '3.27.7'
    logbackVersion = '1.5.25'
    commonsCompressVersion = '1.26.0'
    nettyVersion = '4.1.125.Final'
    jacksonCoreVersion = '2.21.1'
    bucket4jVersion = '8.18.0'
    telegramBotsVersion = '9.5.0'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
    }

    dependencies {
        // CVE-2025-48924
        dependency "org.apache.commons:commons-lang3:3.18.0"
    }
}

dependencies {
    // Telegram Bot API
    implementation "org.telegram:telegrambots-springboot-longpolling-starter:$telegramBotsVersion"
    implementation "org.telegram:telegrambots-client:$telegramBotsVersion"

    // Rate limiting
    implementation("com.bucket4j:bucket4j_jdk17-lettuce:$bucket4jVersion")

    // Serialization
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    // Redis (provided by the consumer of this starter)
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot configuration metadata generation
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Stub for IntelliJ IDEA Kotlin DSL indexing
tasks.register("prepareKotlinBuildScriptModel") {}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Test reports configurations

jacoco {
    toolVersion = "0.8.12"
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// Suppresses missing Javadoc warnings (e.g. undocumented default constructors),
// but still validates the quality of existing comments.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}