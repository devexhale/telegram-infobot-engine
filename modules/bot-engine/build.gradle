plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'jacoco'
}

group = 'com.github.jawisimo'
version = '1.0'
description = 'Telegram Dialog Bot Engine Spring Boot Starter'

base {
    archivesName = 'telegram-dialog-bot-spring-boot-starter'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

ext {
    springBootVersion = '3.5.5'
    springCoreVersion = '6.2.11'
    springDataCommonsVersion = '3.4.0'
    commonsLang3Version = '3.18.0'
    assertjVersion = '3.27.7'
    logbackVersion = '1.5.25'
    commonsCompressVersion = '1.26.0'
    nettyVersion = '4.1.125.Final'
    jacksonCoreVersion = '2.21.1'
    telegramBotsVersion = '9.2.1'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
    }
    dependencies {
        // CVE-2025-41249
        dependency "org.springframework:spring-core:$springCoreVersion"
        dependency "org.springframework:spring-context:$springCoreVersion"
        dependency "org.springframework:spring-beans:$springCoreVersion"
        dependency "org.springframework:spring-web:$springCoreVersion"

        // CVE-2025-48924
        dependency "org.apache.commons:commons-lang3:$commonsLang3Version"

        // CVE-2026-24400
        dependency "org.assertj:assertj-core:$assertjVersion"

        // CVE-2025-11226, CVE-2026-1225
        dependency "ch.qos.logback:logback-core:$logbackVersion"
        dependency "ch.qos.logback:logback-classic:$logbackVersion"

        // CVE-2024-25710, CVE-2024-26308
        dependency "org.apache.commons:commons-compress:$commonsCompressVersion"

        // CVE-2025-58057
        dependency "io.netty:netty-codec:$nettyVersion"

        // GHSA-72hv-8253-57qq
        dependency "com.fasterxml.jackson.core:jackson-core:$jacksonCoreVersion"
    }
}

dependencies {
    // Telegram Bot API
    implementation "org.telegram:telegrambots-springboot-longpolling-starter:$telegramBotsVersion"
    implementation "org.telegram:telegrambots-client:$telegramBotsVersion"

    // Cache
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Serialization
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    // Optional — Redis support (provided by the consumer of this starter)
    implementation "org.springframework.data:spring-data-commons:$springDataCommonsVersion"
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot configuration metadata generation
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Stub for IntelliJ IDEA Kotlin DSL indexing
tasks.register("prepareKotlinBuildScriptModel") {}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Test reports configurations

jacoco {
    toolVersion = "0.8.12"
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/interaction/command/commandset/**',
                    '**/model/**'
            ])
        }))
    }
}

// Suppresses missing Javadoc warnings (e.g. undocumented default constructors),
// but still validates the quality of existing comments.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
    repositories {
        mavenLocal()
    }
}