plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'jacoco'
}

group = 'io.github.devexhale'
version = '1.0.0'
description = 'Telegram InfoBot Engine Spring Boot Starter'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// =====================================================================================================================
// Dependencies & Versions
// =====================================================================================================================

ext {
    telegramBotsVersion = '9.5.0'
    bucket4jVersion = '8.18.0'
    commonsLang3Version = '3.18.0' // Overridden for CVE-2025-48924
    springBootVersion = '4.0.7'
    guavaVersion = '33.6.0-jre'
    jacocoVersion = '0.8.15'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
    }
    dependencies {
        // Force upgrade to fix CVE-2025-48924
        dependency "org.apache.commons:commons-lang3:$commonsLang3Version"
    }
}

dependencies {
    // --- Telegram Bot API ---
    implementation "org.telegram:telegrambots-client:$telegramBotsVersion"
    implementation "org.telegram:telegrambots-springboot-longpolling-starter:$telegramBotsVersion"

    // --- Infrastructure & Rate Limiting ---
    implementation "com.bucket4j:bucket4j_jdk17-lettuce:$bucket4jVersion"

    // Striped locking for per-chat synchronization between dialog and broadcast delivery
    implementation "com.google.guava:guava:$guavaVersion"

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // --- Serialization ---
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    // --- Annotation Processors ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // IDE autocomplete & metadata for application.properties keys
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Faster startup: pre-computed metadata for @Conditional filtering
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// =====================================================================================================================
// Compilation & Encoding
// =====================================================================================================================

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Stub for IntelliJ IDEA Kotlin DSL indexing (prevents false-positive errors in IDE)
tasks.register("prepareKotlinBuildScriptModel") {}

// =====================================================================================================================
// Testing & Code Coverage (JaCoCo)
// =====================================================================================================================

jacoco {
    toolVersion = jacocoVersion
}

tasks.named('test', Test) {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// =====================================================================================================================
// Javadoc Configuration
// =====================================================================================================================

// Suppresses missing Javadoc warnings (e.g., undocumented default constructors),
// but still validates the quality of existing comments.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:-missing', '-quiet')
    options.encoding = 'UTF-8'
}

// =====================================================================================================================
// Publishing
// =====================================================================================================================

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
            artifactId = 'telegram-infobot-engine-spring-boot-starter'
        }
    }
    repositories {
        mavenLocal()
    }
}