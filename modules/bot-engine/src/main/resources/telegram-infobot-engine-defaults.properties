# =====================================================================================================================
# Telegram Bot Engine - Default Configuration
# =====================================================================================================================
# These properties define the default values for the bot-engine starter.
# Consumer applications can override any of these in their own application.properties.
# =====================================================================================================================

# --- Bot Identity ---
telegram.bot.name=DefaultBot

# --- Dialog Settings ---
# Maximum number of buttons rendered per row in inline/reply keyboards
telegram.bot.dialog.buttons-per-row=1

# --- Rate Limiting ---
# Global rate limit (applied across all chats combined)
telegram.bot.rate-limit.global.capacity=25
telegram.bot.rate-limit.global.rate=25
telegram.bot.rate-limit.global.interval=1s

# Per-chat rate limit (applied to each individual chat)
telegram.bot.rate-limit.chat.capacity=3
telegram.bot.rate-limit.chat.rate=3
telegram.bot.rate-limit.chat.interval=1s

# --- Broadcast ---
# Scheduled mass mailing feature
telegram.bot.broadcast.enabled=false