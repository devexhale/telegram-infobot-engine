plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.jawisimo'
version = '1.0'
description = 'tg-bot-config-framework'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.github.jawisimo.bottemplate.BotTemplateApplication'
}