/start:
  content:
    - type: TEXT
      text: "Перевірте свої знання та дізнайтесь більше про світ навколо!"
    - type: MEDIA
      media:
        type: PHOTO
        fileName: Qstart.jpg
  question: "Ласкаво просимо до вікторини. Оберіть тему: "
  button_type: reply
  buttons:
    - label: "🏛️ Історія"
      next: "history_q1"
    - label: "🔬 Наука"
      next: "science_q1"
    - label: "🌎 Географія"
      next: "geography_q1"
    - label: "🎬 Кіно"
      next: "cinema_q1"

history_q1:
  content:
    - type: TEXT
      text: "Питання 1: "
  question: "Яка подія, що відбулась 28 червня 1914 року, стала безпосереднім каталізатором початку Першої світової війни? "
  button_type: INLINE
  buttons:
    - label: "Вбивство ерцгерцога Франца Фердинанда"
      next: "history_q1_correct"
    - label: "Підписання Версальського договору"
      next: "history_q1_wrong"
    - label: "Вторгнення Німеччини в Бельгію"
      next: "history_q1_wrong"
    - label: "Битва на Соммі"
      next: "history_q1_wrong"
