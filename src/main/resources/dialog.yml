/start:
  content:
    - type: text
      text: "Перевірте свої знання та дізнайтесь більше про світ навколо!"
    - type: media
      media:
        type: photo
        file_name: Qstart.jpg
    - type: media
      media:
        type: audio
        file_name: quest.mp3
  prompt: "Почнемо нашу подорож. Оберіть тему: "
  button_type: inline
  buttons:
    - label: "🏛️ Історія"
      next: "history_q1"
    - label: "🔬 Наука"
      next: "science_q1"
    - label: "🌎 Географія"
      next: "geography_q1"
    - label: "🎬 Кіно"
      next: "cinema_q1"

